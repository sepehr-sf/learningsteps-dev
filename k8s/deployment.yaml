
# Kubernetes Deployment for the LearningSteps FastAPI application.
apiVersion: apps/v1
kind: Deployment

metadata:
  # Keep the existing Deployment name to update it in place.
  name: learningsteps-api
  namespace: learningsteps
  labels:
    app: learningsteps-api

spec:
  # Run two replicas for improved application availability.
  #replicas: 2 - Removed to allow HPA to manage the number of replicas automatically.

  # Identify the pods managed by this Deployment.
  selector:
    matchLabels:
      app: learningsteps-api

  # Define how Kubernetes updates application pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: learningsteps-api

    spec:
      # Run the application container.
      containers:
        - name: api

          # CI/CD replaces this placeholder with the verified commit SHA image.
          image: learningstepsacr2026.azurecr.io/learningsteps-api:placeholder
          imagePullPolicy: IfNotPresent

            # Expose the FastAPI application port.
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Load non-sensitive application settings from the ConfigMap.
          envFrom:
            - configMapRef:
                name: learningsteps-config

          # Load database credentials from the Kubernetes Secret.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: learningsteps-postgres
                  key: connection-string

          # Define resource requests and limits for scheduling and scaling.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Check whether the application is alive.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          # Check whether the application can receive traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # Mount the existing Azure Key Vault CSI volume.
          volumeMounts:
            - name: postgres-secret
              mountPath: /mnt/secrets-store
              readOnly: true

          # Run the container as a non-root user.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false

      # Define the CSI volume connected to Azure Key Vault.
      volumes:
        - name: postgres-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: learningsteps-postgres
