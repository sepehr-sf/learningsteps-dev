alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: false

  retention: "3d"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  service:
    type: ClusterIP

extraScrapeConfigs: |
  - job_name: 'learningsteps-api'
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - learningsteps
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: learningsteps-api
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http