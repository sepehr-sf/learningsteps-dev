# Connect the Kubernetes Secrets Store CSI Driver to Azure Key Vault.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  # Preserve the existing SecretProviderClass name.
  name: learningsteps-postgres
  namespace: learningsteps

spec:
  provider: azure

  parameters:
    # Azure Key Vault containing the database connection string.
    keyvaultName: kv-learningsteps-731926

    # Use the existing AKS node managed identity.
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: 34925d7a-6f6c-4ca8-ad1c-cc5e1c6385ae

    # Azure tenant that owns the Key Vault.
    tenantId: c0531484-50fa-4ff2-97df-b1f2d4810603

    # Retrieve the database connection string from Key Vault.
    objects: |
      array:
        - |
          objectName: postgres-connection-string
          objectType: secret
          objectVersion: ""

  # Synchronize the Key Vault value into a Kubernetes Secret.
  secretObjects:
    - secretName: learningsteps-postgres
      type: Opaque
      data:
        - objectName: postgres-connection-string
          key: connection-string