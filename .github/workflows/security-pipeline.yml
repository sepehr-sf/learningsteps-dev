
name: LearningSteps DevSecOps Pipeline

on:
  push:
    branches:
      - reference
  pull_request:
    branches:
      - reference
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. Secret scanning
  secret-scanning:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Debug Git history
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse HEAD

          echo "Previous commit:"
          git rev-parse HEAD^

          echo "Recent commits:"
          git log -5 --oneline

          echo "Repository status:"
          git status

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-excludes.txt

      - name: Scan complete branch history
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-excludes.txt


  # 2. Terraform security scanning
  terraform-security:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Scan Terraform configuration
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          skip_check: CKV_AZURE_5,CKV_AZURE_116,CKV_AZURE_4,CKV_AZURE_7,CKV_AZURE_6,CKV_AZURE_117,CKV_AZURE_115,CKV_AZURE_139,CKV_AZURE_136,CKV_AZURE_109,CKV_AZURE_110,CKV_AZURE_42,CKV_AZURE_114,CKV_AZURE_41

  python-lint:
    name: Python Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check api/ --ignore B008,BLE001

  # 3. Build and scan Docker image
  container-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - secret-scanning
      - terraform-security
      - python-lint
      - python-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build LearningSteps API image
        run: |
          docker build \
            --pull \
            -t learningsteps-api:${{ github.sha }} \
            -f Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: learningsteps-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Save scanned Docker image
        run: |
          docker save \
            -o learningsteps-api.tar \
            learningsteps-api:${{ github.sha }}

      - name: Upload scanned image
        uses: actions/upload-artifact@v4
        with:
          name: learningsteps-api-image
          path: learningsteps-api.tar
          retention-days: 1
  # Run real FastAPI integration tests against an isolated PostgreSQL database.
  # This database exists only during this GitHub Actions job.
  python-tests:
    name: Python Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learningsteps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learningsteps_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run integration tests
        run: pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learningsteps_test
          PYTHONPATH: api

  # 4. Publish scanned image to Azure Container Registry
  publish-to-acr:
    name: Publish Secure Image to ACR
    runs-on: ubuntu-latest

    needs:
      - secret-scanning
      - terraform-security
      - container-security

    if: github.ref == 'refs/heads/reference' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: learningsteps-api-image

      - name: Load scanned Docker image
        run: docker load -i learningsteps-api.tar

      - name: Authenticate with Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name learningstepsacr2026

      - name: Tag and push scanned image
        run: |
          IMAGE="learningstepsacr2026.azurecr.io/learningsteps-api"

          docker tag "learningsteps-api:${GITHUB_SHA}" "$IMAGE:${GITHUB_SHA}"
          docker tag "learningsteps-api:${GITHUB_SHA}" "$IMAGE:latest"

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  # 5. Deploy the verified image to AKS
  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest

    needs:
      - publish-to-acr

    if: github.ref == 'refs/heads/reference' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write


    steps:
      # Download the repository so Kubernetes manifests are available.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate with Azure using OpenID Connect.
      - name: Authenticate with Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Install the Kubernetes authentication plugin.
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.22'

      - name: Connect to AKS
        uses: azure/aks-set-context@v5
        with:
          resource-group: rg-learningsteps-dev
          cluster-name: aks-learningsteps-dev
          admin: 'false'
          use-kubelogin: 'true'

      # Configure the Azure Key Vault integration before creating application pods.
      - name: Apply Azure Key Vault SecretProviderClass
        run: kubectl apply -f k8s/secret-provider-class.yaml
      # Apply non-sensitive application configuration first.
      - name: Apply Kubernetes ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      # Apply the existing external LoadBalancer Service.
      - name: Apply Kubernetes Service
        run: kubectl apply -f k8s/service.yaml

      # Generate the Deployment using the verified commit SHA image.
      - name: Apply Kubernetes Deployment
        run: |
          # Define the immutable image tag for this Git commit.
          IMAGE="learningstepsacr2026.azurecr.io/learningsteps-api:${GITHUB_SHA}"

          # Replace the placeholder before applying the Deployment.
          sed "s|:placeholder|:${GITHUB_SHA}|g" \
            k8s/deployment.yaml > /tmp/deployment.yaml

          # Apply the Deployment with the correct image.
          kubectl apply -f /tmp/deployment.yaml

      # Configure automatic pod scaling.
      - name: Apply Kubernetes HPA
        run: kubectl apply -f k8s/hpa.yaml

      # Wait until the application rollout succeeds.
      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/learningsteps-api \
            --namespace learningsteps \
            --timeout=180s

      # Confirm that AKS is running the expected commit image.
      - name: Verify deployed image
        run: |
          IMAGE="learningstepsacr2026.azurecr.io/learningsteps-api:${GITHUB_SHA}"

          ACTUAL_IMAGE=$(kubectl get deployment learningsteps-api \
            --namespace learningsteps \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')

          echo "Expected image: $IMAGE"
          echo "Actual image:   $ACTUAL_IMAGE"

          test "$ACTUAL_IMAGE" = "$IMAGE"
